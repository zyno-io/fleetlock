name: multiarch
on:
  workflow_call:

env:
  GHCR_REPO: ghcr.io/${{ github.repository }}

jobs:
  build-amd64:
    name: build-amd64
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build Image
        run: make image-amd64

      - name: GHCR Login
        if: github.ref == 'refs/heads/fork'
        run: |
          buildah login -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}" ghcr.io

      - name: Push Image
        if: github.ref == 'refs/heads/fork'
        run: |
          VERSION=$(git describe --tags --match=v* --always --dirty)
          buildah tag poseidon/fleetlock:${VERSION}-amd64 ${GHCR_REPO}:${VERSION}-amd64
          buildah push --format v2s2 ${GHCR_REPO}:${VERSION}-amd64

  build-arm64:
    name: build-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build Image
        run: make image-arm64

      - name: GHCR Login
        if: github.ref == 'refs/heads/fork'
        run: |
          buildah login -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}" ghcr.io

      - name: Push Image
        if: github.ref == 'refs/heads/fork'
        run: |
          VERSION=$(git describe --tags --match=v* --always --dirty)
          buildah tag poseidon/fleetlock:${VERSION}-arm64 ${GHCR_REPO}:${VERSION}-arm64
          buildah push --format v2s2 ${GHCR_REPO}:${VERSION}-arm64

  manifest:
    name: manifest
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/fork'
    needs:
      - build-amd64
      - build-arm64
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: GHCR Login
        run: |
          buildah login -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}" ghcr.io

      - name: Push Multi-Arch
        run: |
          VERSION=$(git describe --tags --match=v* --always --dirty)
          buildah manifest create ${GHCR_REPO}:${VERSION}
          buildah manifest add ${GHCR_REPO}:${VERSION} docker://${GHCR_REPO}:${VERSION}-amd64
          buildah manifest add --variant v8 ${GHCR_REPO}:${VERSION} docker://${GHCR_REPO}:${VERSION}-arm64
          buildah manifest inspect ${GHCR_REPO}:${VERSION}
          buildah manifest push -f v2s2 ${GHCR_REPO}:${VERSION} docker://${GHCR_REPO}:${VERSION}
